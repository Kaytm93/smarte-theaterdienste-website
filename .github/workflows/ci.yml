name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build
        env:
          # Without Supabase env, queries graceful-degrade to ComingSoonHero
          # so the build stays SSG-clean (see ADR-31).
          NEXT_PUBLIC_SITE_URL: https://smarte-theaterdienste-website.vercel.app
